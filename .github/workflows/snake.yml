name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Ilyan321
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push snake to output branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan output-temp || git checkout output 2>/dev/null || git checkout --orphan output
          git rm -rf . --quiet 2>/dev/null || true
          cp dist/github-contribution-grid-snake.svg ./github-contribution-grid-snake.svg
          cp dist/github-contribution-grid-snake-dark.svg ./github-contribution-grid-snake-dark.svg
          git add github-contribution-grid-snake.svg github-contribution-grid-snake-dark.svg
          git commit -m "🐍 Update snake animation [skip ci]" --allow-empty
          git push origin HEAD:output --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
